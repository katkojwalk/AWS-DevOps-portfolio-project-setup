apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-frontend
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "#000000",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{image!~\"^$\"}[5m]))",
              "legendFormat": "CPU cores",
              "refId": "A"
            }
          ],
          "title": "CPU Usage (cores)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {},
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{image!~\"^$\"}) / 1024 / 1024",
              "legendFormat": "MB",
              "refId": "A"
            }
          ],
          "title": "Memory Usage (MB)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 8},
          "id": 3,
          "options": {},
          "targets": [
            {"expr": "count(kube_pod_info)", "legendFormat": "Pods", "refId": "A"}
          ],
          "title": "Pod Count",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 8},
          "id": 4,
          "options": {},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=~\"frontend|app\"}[5m]))",
              "legendFormat": "req/s",
              "refId": "A"
            }
          ],
          "title": "Requests per Second (total)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 8},
          "id": 5,
          "options": {},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=~\"frontend|app\", status=~\"5..\"}[5m]))",
              "legendFormat": "5xx/s",
              "refId": "A"
            }
          ],
          "title": "5xx Errors per Second",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 8},
          "id": 6,
          "options": {},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\"frontend|app\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "title": "P95 Request Latency (s)",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 27,
      "style": "dark",
      "tags": ["devops","frontend"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "DevOps Portfolio - Overview",
      "uid": "devops-portfolio-overview",
      "version": 1
    }
