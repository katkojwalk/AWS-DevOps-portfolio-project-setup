apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-provision-wait
  namespace: monitoring
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: bitnami/kubectl:latest
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "Waiting for Grafana to pick up dashboards..."
              # wait until grafana sidecar pod is running
              for i in $(seq 1 30); do
                kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].status.phase}' >/dev/null 2>&1 && break || true
                sleep 5
              done
              echo "Done"
  backoffLimit: 1
